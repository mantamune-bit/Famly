<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Famly">
<meta name="theme-color" content="#FBF7F2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Famly</title>
<style>
:root{--bg:#FBF7F2;--card:#fff;--ink:#2B2622;--muted:#8A8178;--line:#ECE5DC;--acc:#E07A5F;--acc2:#3D7EA6;--ok:#5B8C51;--chip:#F3ECE3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.pad{padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
h1{font-size:26px;margin:2px 0 14px;letter-spacing:-.02em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:24px 0 8px;font-weight:600}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 0 var(--line),0 6px 20px rgba(60,40,20,.05);margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:10px 14px;border-radius:999px;font-size:15px;font-weight:500}
.chip.on{background:var(--ink);color:#fff}
.btn{border:0;background:var(--acc);color:#fff;padding:13px 18px;border-radius:14px;font-size:16px;font-weight:600;width:100%}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.big{padding:18px;font-size:18px}
.btn.sm{width:auto;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.5}
.q{font-weight:600;margin:16px 0 8px}
.alert{padding:12px 14px;border-radius:14px;margin-bottom:8px;font-size:15px}
.alert.red{background:#FBE4E0;color:#7A2A22}.alert.amber{background:#FBEFD9;color:#6E4810}.alert.soft{background:var(--chip)}.alert.ok{background:#E6F0E2;color:#2F5128}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:0 1px 0 var(--line)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;flex:none;font-weight:700;color:#fff;padding:0}
.item.done .check{background:var(--ok);border-color:var(--ok)}
.grow{flex:1;min-width:0}.t{font-weight:500;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);font-size:22px;padding:0 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(251,247,242,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;max-width:140px;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs .i{font-size:22px}.tabs button.on{color:var(--ink);font-weight:600}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--acc);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.days{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.day{background:var(--card);border-radius:14px;padding:12px;min-height:86px;box-shadow:0 1px 0 var(--line);cursor:pointer}
.free{color:var(--ok);font-weight:600;font-size:14px;margin-top:4px}
.plan{display:inline-block;background:var(--chip);border-radius:8px;padding:4px 8px;margin:6px 4px 0 0;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(30,20,10,.35);display:flex;align-items:flex-end;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
input,textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--acc);border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 3px;text-align:center;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}td:first-child,th:first-child{text-align:left}
.center{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.summary{font-size:15px;line-height:1.7}
.stat{flex:1;background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}
.logo{border-radius:22%;display:block}
.tabs .logo{width:24px;height:24px;margin:1px 0 1px;opacity:.55}
.tabs button.on .logo{opacity:1}
.face{flex:none;display:inline-block;vertical-align:middle}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, { useState, useEffect, useCallback } from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1';
import htm from 'https://esm.sh/htm@3.1.1';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ====== ISI DUA BARIS INI (lihat SETUP.md) ======
const SUPABASE_URL = 'https://ldioysekbhtowfyylvfy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkaW95c2VrYmh0b3dmeXlsdmZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjYwMDEsImV4cCI6MjEwNzkwMjAwMX0.0mHQEiObLfmHFuLB2TTL9LPgg4uk1jgIFnPVwEGusCk';
// ================================================

const html = htm.bind(React.createElement);
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, storageKey: 'famly-auth' } });
const COLORS = ['#E07A5F', '#3D7EA6'];

// ---------- tanggal (selalu zona Asia/Jakarta) ----------
const TZ = 'Asia/Jakarta';
const ymd = (d = new Date()) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const nowHM = () => new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
const parts = s => s.split('-').map(Number);
const addDays = (s, n) => { const [y, m, d] = parts(s); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const dow = s => { const [y, m, d] = parts(s); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
const HARI = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const HARI_P = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtShort = s => { const [, m, d] = parts(s); return `${d} ${BULAN[m - 1]}`; };
const fmtDay = s => `${HARI_P[dow(s)]}, ${fmtShort(s)}`;
const thisSat = t => { const d = dow(t); return d === 6 ? t : d === 0 ? addDays(t, -1) : addDays(t, 6 - d); };
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtMin = m => { m = Math.round(m); return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), k = Math.floor(s.length / 2); return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; };
const hrs = h => { if (h == null) return '–'; let H = Math.floor(h), M = Math.round((h - H) * 60); if (M === 60) { H++; M = 0; } return M ? `${H}j ${M}m` : `${H}j`; };
const num = n => n == null ? '–' : Number(n).toLocaleString('id-ID');

const FEEL = { good: '😀', meh: '😐', sick: '🤒' };
const FOOD = { good: '👍', meh: '😐', bad: '👎' };

// ---------- logika kesehatan ----------
const byDay = (checkins, uid) => Object.fromEntries(checkins.filter(c => c.member_id === uid).map(c => [c.day, c]));

function computeAlerts(members, checkins, today) {
  const out = [];
  for (const m of members) {
    const by = byDay(checkins, m.id);
    const target = Number(m.sleep_target);
    if (by[today]?.feeling === 'sick') out.push({ level: 'red', text: `${m.name} lagi kurang sehat hari ini. Kurangi beban, tambah istirahat.` });

    const sl = [0, 1, 2].map(i => by[addDays(today, -i)]?.sleep_hours).filter(v => v != null).map(Number);
    if (sl.length === 3 && avg(sl) < target) out.push({ level: 'amber', text: `${m.name} rata-rata tidur ${hrs(avg(sl))} dalam 3 malam terakhir (target ${hrs(target)}). Malam ini tidur lebih awal ya.` });

    const base = []; for (let i = 3; i < 17; i++) { const w = toMin(by[addDays(today, -i)]?.wake_time); if (w != null) base.push(w); }
    const recent = [0, 1, 2].map(i => toMin(by[addDays(today, -i)]?.wake_time)).filter(v => v != null);
    if (base.length >= 5 && recent.length === 3) {
      const usual = median(base);
      if (recent.every(w => Math.abs(w - usual) > 60)) out.push({ level: 'amber', text: `Jam bangun ${m.name} bergeser: biasanya ${fmtMin(usual)}, 3 hari ini sekitar ${fmtMin(avg(recent))}. Ritmenya mulai berubah.` });
    }

    const st = [1, 2, 3].map(i => by[addDays(today, -i)]?.steps).filter(v => v != null);
    if (st.length === 3 && avg(st) < Number(m.steps_target) * 0.5) out.push({ level: 'soft', text: `${m.name} kurang gerak 3 hari terakhir (rata-rata ${num(Math.round(avg(st)))} langkah).` });

    const fd = [0, 1, 2].map(i => by[addDays(today, -i)]?.food_prev).filter(Boolean);
    if (fd.length === 3 && fd.every(f => f === 'bad')) out.push({ level: 'soft', text: `Makan ${m.name} kurang baik 3 hari berturut-turut.` });

    const everChecked = checkins.some(c => c.member_id === m.id && c.feeling);
    if (everChecked && !by[addDays(today, -1)]?.feeling && !by[addDays(today, -2)]?.feeling) out.push({ level: 'soft', text: `${m.name} belum check-in 2 hari. Rutinitasnya aman?` });
  }
  return out;
}

function scores(m, checkins, today) {
  const by = byDay(checkins, m.id);
  const last = (from, to) => { const r = []; for (let i = from; i <= to; i++) r.push(by[addDays(today, -i)]); return r; };
  const sl = last(0, 6).map(c => c?.sleep_hours).filter(v => v != null).map(Number);
  const st = last(1, 7).map(c => c?.steps).filter(v => v != null);
  const wk = last(0, 6).map(c => toMin(c?.wake_time)).filter(v => v != null);
  const fd = last(0, 6).map(c => c?.food_prev).filter(Boolean).map(f => ({ good: 1, meh: 0.5, bad: 0 })[f]);
  return {
    sleep: sl.length ? Math.min(1, avg(sl) / Number(m.sleep_target)) : null,
    sport: st.length ? Math.min(1, avg(st) / Number(m.steps_target)) : null,
    food: fd.length ? avg(fd) : null,
    avgSleep: avg(sl), avgSteps: st.length ? Math.round(avg(st)) : null, wake: median(wk),
  };
}

function sickInsight(m, checkins) {
  const by = byDay(checkins, m.id);
  const sick = Object.values(by).filter(c => c.feeling === 'sick').map(c => c.day);
  const starts = sick.filter(d => !sick.includes(addDays(d, -1)));
  const before = [];
  for (const s of starts) for (let i = 1; i <= 3; i++) { const v = by[addDays(s, -i)]?.sleep_hours; if (v != null) before.push(Number(v)); }
  const normal = Object.values(by).filter(c => c.feeling && c.feeling !== 'sick' && c.sleep_hours != null).map(c => Number(c.sleep_hours));
  if (before.length < 2 || normal.length < 5) return null;
  return `${starts.length}x sakit dalam 90 hari. 3 malam sebelum sakit, ${m.name} rata-rata tidur ${hrs(avg(before))}; di hari sehat ${hrs(avg(normal))}.`;
}

// ---------- komponen kecil ----------
const Chips = ({ options, value, onPick }) => html`<div className="chips">${options.map(([v, label]) =>
  html`<button key=${String(v)} className=${'chip' + (value === v ? ' on' : '')} onClick=${() => onPick(v)}>${label}</button>`)}</div>`;

const Sheet = ({ close, children }) => html`<div className="overlay" onClick=${close}>
  <div className="sheet" onClick=${e => e.stopPropagation()}>${children}</div></div>`;

// Wajah kecil, gaya sama dengan logo
const Face = ({ color = '#E07A5F', size = 22 }) => html`<svg className="face" width=${size} height=${size} viewBox="0 0 40 40" aria-hidden="true">
  <circle cx="20" cy="20" r="17" fill="#FBF7F2" stroke=${color} stroke-width="4" />
  <circle cx="14.5" cy="19" r="2" fill="#3B2A22" /><circle cx="25.5" cy="19" r="2" fill="#3B2A22" />
  <path d="M16.5 24.5 Q20 27.5 23.5 24.5" fill="none" stroke="#3B2A22" stroke-width="1.7" stroke-linecap="round" />
  <ellipse cx="11" cy="24" rx="2.4" ry="1.5" fill="#F29A8E" /><ellipse cx="29" cy="24" rx="2.4" ry="1.5" fill="#F29A8E" />
</svg>`;

// ---------- Login ----------
function Login() {
  const [busy, setBusy] = useState(false);
  const go = async () => {
    setBusy(true);
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    if (error) { alert(error.message); setBusy(false); }
  };
  return html`<div className="center"><div className="card" style=${{ width: '100%', maxWidth: 380, textAlign: 'center' }}>
    <img src="icon-180.png" alt="" style=${{ width: 84, height: 84, borderRadius: 20, display: 'block', margin: '0 auto 10px' }} />
    <h1>Famly</h1>
    <button className="btn" disabled=${busy} onClick=${go}>${busy ? 'Membuka Google…' : 'Masuk dengan Google'}</button>
  </div></div>`;
}

// ---------- Pilih profil (sekali per HP) ----------
const ME_KEY = 'famly-me';
const getMe = () => { try { return localStorage.getItem(ME_KEY); } catch { return null; } };
const setMeLS = id => { try { id ? localStorage.setItem(ME_KEY, id) : localStorage.removeItem(ME_KEY); } catch {} };

function PickMe({ members, onPick }) {
  return html`<div className="center"><div className="card" style=${{ width: '100%', maxWidth: 380, textAlign: 'center' }}>
    <h1 style=${{ fontSize: 22 }}>Siapa kamu?</h1>
    <p className="small muted" style=${{ marginTop: -6 }}>Cukup sekali di HP ini.</p>
    ${members.map((m, i) => html`<button key=${m.id} className="btn ghost big row" style=${{ justifyContent: 'center', gap: 12, marginBottom: 10 }} onClick=${() => onPick(m.id)}>
      <${Face} color=${COLORS[i % 2]} size=${34} />${m.name}</button>`)}
  </div></div>`;
}

// ---------- Check-in pagi ----------
function CheckIn({ ctx }) {
  const { me, partner, checkins, today } = ctx;
  const row = checkins.find(c => c.member_id === me.id && c.day === today) || {};
  const [local, setLocal] = useState(row);
  const [edit, setEdit] = useState(false);
  useEffect(() => setLocal(row), [JSON.stringify(row)]);

  const save = async patch => {
    setLocal(l => ({ ...l, ...patch }));
    const { error } = await sb.from('checkins').upsert({ member_id: me.id, day: today, ...patch, updated_at: new Date().toISOString() }, { onConflict: 'member_id,day' });
    if (error) alert('Gagal menyimpan: ' + error.message); else ctx.reload();
  };

  const complete = local.wake_time && local.sleep_hours != null && local.feeling && local.food_prev;
  const prow = partner && checkins.find(c => c.member_id === partner.id && c.day === today);
  const partnerLine = partner && html`<div className="small muted" style=${{ marginTop: 10 }}>
    <${Face} color=${ctx.colorOf(partner.id)} size=${18} /> ${partner.name}: ${prow?.feeling ? html`sudah check-in ${FEEL[prow.feeling]}${prow.sleep_hours != null ? ` · tidur ${hrs(Number(prow.sleep_hours))}` : ''}` : 'belum check-in'}</div>`;
  const steps = html`<div className="small muted" style=${{ marginTop: 6 }}>
    🏃 ${local.steps != null ? `${num(local.steps)} langkah hari ini` : 'Langkah belum masuk dari iPhone hari ini'}</div>`;

  if (complete && !edit) return html`<div className="card">
    <div className="row between"><b>✓ Check-in hari ini</b><button className="btn ghost sm" onClick=${() => setEdit(true)}>Ubah</button></div>
    <div className="summary" style=${{ marginTop: 6 }}>☀️ Bangun ${local.wake_time.slice(0, 5)} · 😴 ${hrs(Number(local.sleep_hours))} · ${FEEL[local.feeling]} · makan kemarin ${FOOD[local.food_prev]}</div>
    ${steps}${partnerLine}</div>`;

  return html`<div className="card">
    ${!local.wake_time
      ? html`<button className="btn big" onClick=${() => save({ wake_time: nowHM() })}>☀️ Aku bangun</button>
             <div className="small muted" style=${{ marginTop: 6, textAlign: 'center' }}>Tap begitu bangun — jamnya tercatat otomatis</div>`
      : html`<div className="row between"><b>☀️ Bangun jam</b>
             <input type="time" style=${{ width: 120 }} value=${local.wake_time.slice(0, 5)} onChange=${e => e.target.value && save({ wake_time: e.target.value })} /></div>`}
    <div className="q">😴 Tidur kira-kira berapa jam?</div>
    <${Chips} options=${[4, 5, 6, 7, 8, 9].map(h => [h, h === 9 ? '9+' : String(h)])} value=${local.sleep_hours != null ? Number(local.sleep_hours) : null} onPick=${v => save({ sleep_hours: v })} />
    <div className="q">Badan hari ini?</div>
    <${Chips} options=${[['good', '😀 Sehat'], ['meh', '😐 Lemas'], ['sick', '🤒 Sakit']]} value=${local.feeling} onPick=${v => save({ feeling: v })} />
    <div className="q">🍽️ Makan kemarin?</div>
    <${Chips} options=${[['good', '👍 Baik'], ['meh', '😐 Biasa'], ['bad', '👎 Kurang']]} value=${local.food_prev} onPick=${v => save({ food_prev: v })} />
    ${complete && html`<div style=${{ marginTop: 14 }}><button className="btn ghost" onClick=${() => setEdit(false)}>Selesai</button></div>`}
    ${steps}${partnerLine}</div>`;
}

// ---------- Permintaan ----------
function forLabel(ctx, id) { return id == null ? 'berdua' : id === ctx.uid ? 'kamu' : ctx.memberName(id); }

function ReqItem({ r, ctx }) {
  const toggle = async () => {
    const patch = r.done_at ? { done_at: null, done_by: null } : { done_at: new Date().toISOString(), done_by: ctx.uid };
    const { error } = await sb.from('requests').update(patch).eq('id', r.id);
    if (error) alert(error.message); ctx.reload();
  };
  const del = async () => { if (!confirm(`Hapus "${r.title}"?`)) return; await sb.from('requests').delete().eq('id', r.id); ctx.reload(); };
  return html`<div className=${'item' + (r.done_at ? ' done' : '')}>
    <button className="check" onClick=${toggle} aria-label="Selesai">${r.done_at ? '✓' : ''}</button>
    <div className="grow"><div className="t">${r.kind === 'buy' ? '🛒' : '✅'} ${r.title}</div>
      <div className="small muted">untuk ${forLabel(ctx, r.assignee)} · dari ${r.created_by === ctx.uid ? 'kamu' : ctx.memberName(r.created_by)}${r.note ? ' · ' + r.note : ''}</div></div>
    ${!r.done_at && html`<button className="x" onClick=${del} aria-label="Hapus">×</button>`}
  </div>`;
}

function AddRequest({ ctx, close }) {
  const [kind, setKind] = useState('buy'); const [title, setTitle] = useState('');
  const [who, setWho] = useState(ctx.partner ? ctx.partner.id : ctx.uid); const [note, setNote] = useState('');
  const [busy, setBusy] = useState(false);
  const opts = [[ctx.uid, 'Aku'], ...(ctx.partner ? [[ctx.partner.id, ctx.partner.name]] : []), [null, 'Berdua']];
  const submit = async () => {
    if (!title.trim()) return; setBusy(true);
    const { error } = await sb.from('requests').insert({ kind, title: title.trim(), note: note.trim() || null, assignee: who, created_by: ctx.uid });
    setBusy(false); if (error) return alert(error.message); ctx.reload(); close();
  };
  return html`<${Sheet} close=${close}>
    <div className="seg"><button className=${kind === 'buy' ? 'on' : ''} onClick=${() => setKind('buy')}>🛒 Beli</button>
      <button className=${kind === 'do' ? 'on' : ''} onClick=${() => setKind('do')}>✅ Kerjakan</button></div>
    <input autoFocus placeholder=${kind === 'buy' ? 'Beli apa? mis. Obat X' : 'Kerjakan apa? mis. Beresin mainan anak'} value=${title} onChange=${e => setTitle(e.target.value)} onKeyDown=${e => e.key === 'Enter' && submit()} />
    <div className="q">Untuk siapa?</div>
    <${Chips} options=${opts} value=${who} onPick=${setWho} />
    <div style=${{ height: 12 }}></div>
    <input placeholder="Catatan (opsional)" value=${note} onChange=${e => setNote(e.target.value)} />
    <div style=${{ height: 16 }}></div>
    <button className="btn" disabled=${busy || !title.trim()} onClick=${submit}>Tambah</button>
  <//>`;
}

function Requests({ ctx }) {
  const [filter, setFilter] = useState('all'); const [adding, setAdding] = useState(false); const [showDone, setShowDone] = useState(false);
  const all = ctx.requests;
  const open = all.filter(r => !r.done_at);
  const shown = open.filter(r => filter === 'all' || (filter === 'mine' ? (r.assignee === ctx.uid || r.assignee == null) : r.created_by === ctx.uid));
  const done = all.filter(r => r.done_at).sort((a, b) => b.done_at.localeCompare(a.done_at)).slice(0, 20);
  const openTitles = new Set(open.map(r => r.title.trim().toLowerCase()));
  const seen = new Set(), again = [];
  for (const r of all.filter(r => r.kind === 'buy' && r.done_at).sort((a, b) => b.done_at.localeCompare(a.done_at))) {
    const k = r.title.trim().toLowerCase(); if (seen.has(k) || openTitles.has(k)) continue;
    seen.add(k); again.push(r); if (again.length >= 12) break;
  }
  const rebuy = async r => {
    const { error } = await sb.from('requests').insert({ kind: 'buy', title: r.title, note: r.note, assignee: r.assignee, created_by: ctx.uid });
    if (error) alert(error.message); ctx.reload();
  };
  return html`<div>
    <div className="row between"><h1>Permintaan</h1><button className="btn sm" onClick=${() => setAdding(true)}>+ Baru</button></div>
    <div className="seg">${[['all', 'Semua'], ['mine', 'Untukku'], ['from', 'Dariku']].map(([k, l]) =>
      html`<button key=${k} className=${filter === k ? 'on' : ''} onClick=${() => setFilter(k)}>${l}</button>`)}</div>
    ${shown.length ? shown.map(r => html`<${ReqItem} key=${r.id} r=${r} ctx=${ctx} />`) : html`<p className="muted">Tidak ada permintaan terbuka. 🎉</p>`}
    ${again.length > 0 && html`<h2>Beli lagi (sekali tap)</h2>
      <div className="chips">${again.map(r => html`<button key=${r.id} className="chip" onClick=${() => rebuy(r)}>↻ ${r.title}</button>`)}</div>`}
    ${done.length > 0 && html`<h2 onClick=${() => setShowDone(!showDone)} style=${{ cursor: 'pointer' }}>Selesai (${done.length}) ${showDone ? '▾' : '▸'}</h2>
      ${showDone && done.map(r => html`<${ReqItem} key=${r.id} r=${r} ctx=${ctx} />`)}`}
    ${adding && html`<${AddRequest} ctx=${ctx} close=${() => setAdding(false)} />`}
  </div>`;
}

// ---------- Weekend ----------
function AddPlan({ ctx, day, close }) {
  const [title, setTitle] = useState(''); const [who, setWho] = useState(null);
  const opts = [[null, 'Berdua'], [ctx.uid, 'Aku'], ...(ctx.partner ? [[ctx.partner.id, ctx.partner.name]] : [])];
  const submit = async () => {
    if (!title.trim()) return;
    const { error } = await sb.from('plans').insert({ day, title: title.trim(), who, created_by: ctx.uid });
    if (error) return alert(error.message); ctx.reload(); close();
  };
  return html`<${Sheet} close=${close}>
    <h1 style=${{ fontSize: 20 }}>${fmtDay(day)}</h1>
    <input autoFocus placeholder="Ada acara apa? mis. Kondangan" value=${title} onChange=${e => setTitle(e.target.value)} onKeyDown=${e => e.key === 'Enter' && submit()} />
    <div className="q">Siapa?</div>
    <${Chips} options=${opts} value=${who} onPick=${setWho} />
    <div style=${{ height: 16 }}></div>
    <button className="btn" disabled=${!title.trim()} onClick=${submit}>Simpan</button>
  <//>`;
}

function DayCell({ ctx, day, onAdd }) {
  const plans = ctx.plans.filter(p => p.day === day);
  const del = async (e, p) => { e.stopPropagation(); if (!confirm(`Hapus "${p.title}"?`)) return; await sb.from('plans').delete().eq('id', p.id); ctx.reload(); };
  return html`<div className="day" onClick=${() => onAdd(day)}>
    <div className="small muted">${HARI_P[dow(day)]} ${fmtShort(day)}</div>
    ${plans.length ? plans.map(p => html`<span key=${p.id} className="plan" onClick=${e => del(e, p)}>${p.title}${p.who ? ` · ${forLabel(ctx, p.who)}` : ''}</span>`)
      : html`<div className="free">Kosong ✓</div>`}
  </div>`;
}

function Weekend({ ctx }) {
  const [adding, setAdding] = useState(null);
  const sat0 = thisSat(ctx.today);
  const weeks = [...Array(8)].map((_, i) => addDays(sat0, i * 7));
  return html`<div>
    <h1>Weekend</h1>
    <p className="small muted" style=${{ marginTop: -8 }}>Tap hari untuk menambah acara · tap acara untuk menghapus</p>
    ${weeks.map((sat, i) => html`<div key=${sat}>
      <h2>${i === 0 ? 'Weekend ini' : i === 1 ? 'Weekend depan' : `${fmtShort(sat)} – ${fmtShort(addDays(sat, 1))}`}</h2>
      <div className="days"><${DayCell} ctx=${ctx} day=${sat} onAdd=${setAdding} /><${DayCell} ctx=${ctx} day=${addDays(sat, 1)} onAdd=${setAdding} /></div>
    </div>`)}
    ${adding && html`<${AddPlan} ctx=${ctx} day=${adding} close=${() => setAdding(null)} />`}
  </div>`;
}

// ---------- Sehat ----------
function Triangle({ series }) {
  const C = 120, R = 82, ANG = { sleep: -90, sport: 30, food: 150 }, keys = ['sleep', 'sport', 'food'];
  const pt = (k, v) => { const a = ANG[k] * Math.PI / 180; return [C + R * v * Math.cos(a), 112 + R * v * Math.sin(a)]; };
  const poly = vals => keys.map(k => pt(k, vals[k] ?? 0).map(n => n.toFixed(1)).join(',')).join(' ');
  const labels = { sleep: '😴 Tidur', sport: '🏃 Gerak', food: '🍽️ Makan' };
  return html`<svg viewBox="0 0 240 200" style=${{ width: '100%', maxWidth: 320, display: 'block', margin: '0 auto' }}>
    ${[0.33, 0.66, 1].map(g => html`<polygon key=${g} points=${poly({ sleep: g, sport: g, food: g })} fill="none" stroke="#E4DBD0" stroke-width="1" />`)}
    ${keys.map(k => { const [x, y] = pt(k, 1); return html`<line key=${k} x1=${C} y1="112" x2=${x} y2=${y} stroke="#E4DBD0" />`; })}
    ${series.map(s => html`<polygon key=${s.name} points=${poly(s.s)} fill=${s.color} fill-opacity="0.18" stroke=${s.color} stroke-width="2" stroke-linejoin="round" />`)}
    ${keys.map(k => { const [x, y] = pt(k, k === 'sleep' ? 1.2 : 1.18); return html`<text key=${k} x=${x} y=${k === 'sleep' ? y : y + 10} text-anchor="middle" font-size="11" fill="#5A524B">${labels[k]}</text>`; })}
  </svg>`;
}

function Health({ ctx }) {
  const { members, checkins, today, me } = ctx;
  const [who, setWho] = useState(me.id);
  const [settings, setSettings] = useState(false);
  const series = members.map((m, i) => ({ name: m.name, color: COLORS[i % 2], s: scores(m, checkins, today), m }));
  const sel = members.find(m => m.id === who) || me;
  const by = byDay(checkins, sel.id);
  const days = [...Array(14)].map((_, i) => addDays(today, -i));
  const insights = members.map(m => sickInsight(m, checkins)).filter(Boolean);
  return html`<div>
    <div className="row between"><h1>Sehat</h1><button className="btn ghost sm" onClick=${() => setSettings(true)}>⚙︎</button></div>
    <div className="card">
      <${Triangle} series=${series} />
      <div className="row" style=${{ justifyContent: 'center', gap: 16, marginTop: 4 }}>
        ${series.map(s => html`<span key=${s.name} className="row small" style=${{ gap: 6 }}><${Face} color=${s.color} size=${18} />${s.name}</span>`)}</div>
      <p className="small muted" style=${{ textAlign: 'center', marginBottom: 0 }}>7 hari terakhir. Makin penuh segitiganya, makin seimbang.</p>
    </div>
    ${series.map(({ m, s, color }) => html`<div key=${m.id} className="card">
      <div className="row" style=${{ gap: 8, marginBottom: 10 }}><${Face} color=${color} size=${26} /><b>${m.name}</b></div>
      <div className="row">
        <div className="stat"><b>${hrs(s.avgSleep)}</b><span className="small muted">tidur/malam</span></div>
        <div className="stat"><b>${s.wake != null ? fmtMin(s.wake) : '–'}</b><span className="small muted">biasa bangun</span></div>
        <div className="stat"><b>${num(s.avgSteps)}</b><span className="small muted">langkah/hari</span></div>
      </div></div>`)}
    ${insights.length > 0 && html`<h2>Pola sakit</h2>${insights.map((t, i) => html`<div key=${i} className="alert soft">${t}</div>`)}`}
    <h2>Riwayat 14 hari</h2>
    ${members.length > 1 && html`<div className="seg">${members.map(m => html`<button key=${m.id} className=${who === m.id ? 'on' : ''} onClick=${() => setWho(m.id)}>${m.name}</button>`)}</div>`}
    <div className="card" style=${{ padding: '6px 12px' }}><table>
      <thead><tr><th>Hari</th><th>Bangun</th><th>Tidur</th><th>Badan</th><th>Makan*</th><th>Langkah</th></tr></thead>
      <tbody>${days.map(d => { const c = by[d] || {}; return html`<tr key=${d}>
        <td>${HARI[dow(d)]} ${fmtShort(d)}</td><td>${c.wake_time ? c.wake_time.slice(0, 5) : '–'}</td>
        <td>${c.sleep_hours != null ? hrs(Number(c.sleep_hours)) : '–'}</td><td>${FEEL[c.feeling] || '–'}</td>
        <td>${FOOD[c.food_prev] || '–'}</td><td>${num(c.steps)}</td></tr>`; })}</tbody></table>
      <p className="small muted">*Makan = penilaian untuk hari sebelumnya.</p></div>
    ${settings && html`<${Settings} ctx=${ctx} close=${() => setSettings(false)} />`}
  </div>`;
}

function Settings({ ctx, close }) {
  const { me } = ctx;
  const [name, setName] = useState(me.name); const [sleep, setSleep] = useState(String(me.sleep_target)); const [steps, setSteps] = useState(String(me.steps_target));
  const [copied, setCopied] = useState(false);
  const save = async () => {
    const { error } = await sb.from('members').update({ name: name.trim() || me.name, sleep_target: Number(sleep) || 7, steps_target: parseInt(steps) || 7000 }).eq('id', me.id);
    if (error) return alert(error.message); ctx.reload(); close();
  };
  const copy = async () => { try { await navigator.clipboard.writeText(me.ingest_token); setCopied(true); } catch { prompt('Salin token ini:', me.ingest_token); } };
  return html`<${Sheet} close=${close}>
    <h1 style=${{ fontSize: 20 }}>Pengaturan ${me.name}</h1>
    <div className="q">Nama</div><input value=${name} onChange=${e => setName(e.target.value)} />
    <div className="q">Target tidur (jam)</div><input type="number" step="0.5" inputMode="decimal" value=${sleep} onChange=${e => setSleep(e.target.value)} />
    <div className="q">Target langkah per hari</div><input type="number" inputMode="numeric" value=${steps} onChange=${e => setSteps(e.target.value)} />
    <div style=${{ height: 16 }}></div><button className="btn" onClick=${save}>Simpan</button>
    <div className="q">Token Shortcut iPhone</div>
    <p className="small muted" style=${{ marginTop: 0 }}>Dipakai Shortcut untuk mengirim langkah. Jangan dibagikan.</p>
    <button className="btn ghost" onClick=${copy}>${copied ? '✓ Tersalin' : 'Salin token'}</button>
    <div style=${{ height: 10 }}></div>
    <button className="btn ghost" onClick=${() => { ctx.switchMe(); close(); }}>Ganti orang (bukan ${me.name})</button>
    <div style=${{ height: 10 }}></div>
    <button className="btn ghost" onClick=${() => sb.auth.signOut()}>Keluar</button>
  <//>`;
}

// ---------- Beranda ----------
function Home({ ctx, go }) {
  const { me, members, checkins, today, requests } = ctx;
  const h = Number(nowHM().slice(0, 2));
  const greet = h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam';
  const alerts = computeAlerts(members, checkins, today);
  const forMe = requests.filter(r => !r.done_at && (r.assignee === me.id || r.assignee == null));
  const sat = thisSat(ctx.today);
  return html`<div>
    <div className="small muted">${fmtDay(today)}</div>
    <div className="row" style=${{ gap: 12, margin: '2px 0 14px' }}>
      <img src="icon-180.png" alt="" className="logo" width="44" height="44" />
      <h1 style=${{ margin: 0 }}>${greet}, ${me.name}</h1></div>
    <${CheckIn} ctx=${ctx} />
    <h2>Perlu diperhatikan</h2>
    ${alerts.length ? alerts.map((a, i) => html`<div key=${i} className=${'alert ' + a.level}>${a.text}</div>`)
      : html`<div className="alert ok">Belum ada tanda yang perlu dikhawatirkan 🌿</div>`}
    <h2>Untukmu (${forMe.length})</h2>
    ${forMe.length ? forMe.slice(0, 4).map(r => html`<${ReqItem} key=${r.id} r=${r} ctx=${ctx} />`) : html`<p className="muted small">Tidak ada permintaan untukmu.</p>`}
    ${forMe.length > 4 && html`<button className="btn ghost" onClick=${() => go('req')}>Lihat semua</button>`}
    <h2>Weekend ini</h2>
    <div className="days" onClickCapture=${() => go('wk')}>
      ${[sat, addDays(sat, 1)].map(d => { const p = ctx.plans.filter(x => x.day === d); return html`<div key=${d} className="day">
        <div className="small muted">${HARI_P[dow(d)]} ${fmtShort(d)}</div>
        ${p.length ? p.map(x => html`<span key=${x.id} className="plan">${x.title}</span>`) : html`<div className="free">Kosong ✓</div>`}</div>`; })}
    </div>
  </div>`;
}

// ---------- Shell ----------
function Main({ email }) {
  const [tab, setTab] = useState('home');
  const [uid, setUid] = useState(getMe());
  const [data, setData] = useState(null); const [err, setErr] = useState('');
  const load = useCallback(async () => {
    const t = ymd();
    const [mem, ci, rq, pl] = await Promise.all([
      sb.from('members').select('*').order('created_at').order('id'),
      sb.from('checkins').select('*').gte('day', addDays(t, -90)),
      sb.from('requests').select('*').order('created_at', { ascending: false }).limit(300),
      sb.from('plans').select('*').gte('day', addDays(t, -2)).order('day'),
    ]);
    const e = mem.error || ci.error || rq.error || pl.error;
    if (e) { setErr(e.message); return; }
    setErr(''); setData({ members: mem.data, checkins: ci.data, requests: rq.data, plans: pl.data, today: t });
  }, []);
  useEffect(() => {
    load();
    const f = () => document.visibilityState === 'visible' && load();
    document.addEventListener('visibilitychange', f);
    return () => document.removeEventListener('visibilitychange', f);
  }, [load]);

  if (err) return html`<div className="center"><div className="card">Gagal memuat: ${err}<div style=${{ height: 12 }}></div><button className="btn" onClick=${load}>Coba lagi</button></div></div>`;
  if (!data) return html`<div className="center muted">Memuat…</div>`;
  if (!data.members.length) return html`<div className="center"><div className="card" style=${{ maxWidth: 380 }}>Akun <b>${email}</b> tidak punya akses ke Famly.
    <div style=${{ height: 12 }}></div><button className="btn ghost" onClick=${() => sb.auth.signOut()}>Keluar</button></div></div>`;
  const me = data.members.find(m => m.id === uid);
  if (!me) return html`<${PickMe} members=${data.members} onPick=${id => { setMeLS(id); setUid(id); }} />`;
  const partner = data.members.find(m => m.id !== uid);
  const ctx = { ...data, me, partner, uid, reload: load, switchMe: () => { setMeLS(null); setUid(null); }, memberName: id => data.members.find(m => m.id === id)?.name || '?',
    colorOf: id => COLORS[Math.max(0, data.members.findIndex(m => m.id === id)) % 2] };
  const mineOpen = data.requests.filter(r => !r.done_at && (r.assignee === uid || r.assignee == null)).length;
  const TABS = [['home', 'logo', 'Beranda'], ['req', '🛒', 'Permintaan'], ['wk', '📅', 'Weekend'], ['health', '💗', 'Sehat']];
  return html`<div className="app"><main className="pad">
      ${tab === 'home' ? html`<${Home} ctx=${ctx} go=${setTab} />` : tab === 'req' ? html`<${Requests} ctx=${ctx} />` : tab === 'wk' ? html`<${Weekend} ctx=${ctx} />` : html`<${Health} ctx=${ctx} />`}
    </main>
    <nav className="tabs">${TABS.map(([k, i, l]) => html`<button key=${k} className=${tab === k ? 'on' : ''} onClick=${() => { setTab(k); window.scrollTo(0, 0); }}>
      ${i === 'logo' ? html`<img src="icon-180.png" alt="" className="logo" />` : html`<span className="i">${i}</span>`}${l}${k === 'req' && mineOpen > 0 ? html`<span className="badge">${mineOpen}</span>` : null}</button>`)}</nav>
  </div>`;
}

function App() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);
  if (session === undefined) return html`<div className="center muted">Memuat…</div>`;
  return session ? html`<${Main} email=${session.user.email} />` : html`<${Login} />`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
