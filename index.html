<style>
:root{
  --bg:#F5F4F1; --surface:#FFFFFF; --surface2:#F0EEEA; --ink:#191816; --muted:#76716A; --line:#E7E4DE;
  --accent:#E5643F; --accent-ink:#FFFFFF; --accent-soft:rgba(229,100,63,.11);
  --p2:#5165E6; --p2-soft:rgba(81,101,230,.11);
  --good:#1E9B61; --good-soft:rgba(30,155,97,.11);
  --warn:#BF7F00; --warn-soft:rgba(224,160,20,.14);
  --bad:#D63E40; --bad-soft:rgba(214,62,64,.10);
  --shadow:0 1px 2px rgba(25,24,22,.04),0 8px 24px rgba(25,24,22,.05);
  --tabbar:rgba(245,244,241,.86);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F0E; --surface:#1A1918; --surface2:#242320; --ink:#F2F0EB; --muted:#9B968D; --line:#2D2B28;
    --accent:#F27C5C; --accent-ink:#1A0E0A; --accent-soft:rgba(242,124,92,.16);
    --p2:#8193F7; --p2-soft:rgba(129,147,247,.16);
    --good:#3CC488; --good-soft:rgba(60,196,136,.14);
    --warn:#EAB441; --warn-soft:rgba(234,180,65,.14);
    --bad:#F16B6C; --bad-soft:rgba(241,107,108,.14);
    --shadow:none; --tabbar:rgba(15,15,14,.84); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F0E; --surface:#1A1918; --surface2:#242320; --ink:#F2F0EB; --muted:#9B968D; --line:#2D2B28;
  --accent:#F27C5C; --accent-ink:#1A0E0A; --accent-soft:rgba(242,124,92,.16);
  --p2:#8193F7; --p2-soft:rgba(129,147,247,.16);
  --good:#3CC488; --good-soft:rgba(60,196,136,.14);
  --warn:#EAB441; --warn-soft:rgba(234,180,65,.14);
  --bad:#F16B6C; --bad-soft:rgba(241,107,108,.14);
  --shadow:none; --tabbar:rgba(15,15,14,.84); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
svg.ic{display:block;flex:none}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.pad{padding:calc(12px + env(safe-area-inset-top)) 16px 16px}
.hdr{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.hdr h1{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.025em;font-weight:800}
.hdr .sub{color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);padding:0;flex:none}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
.sec h2{font-size:13px;margin:0;font-weight:700;letter-spacing:.01em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.card-title b{font-size:16px;letter-spacing:-.01em}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.q{display:flex;align-items:center;gap:8px;font-weight:700;margin:20px 0 10px;font-size:14px}
.q .ic{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.opt b{display:flex;align-items:center;gap:8px;font-size:14px}
.opt span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;padding-left:26px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on b{color:var(--accent)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:13px 18px;border-radius:14px;font-size:15px;font-weight:700;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.big{padding:17px;font-size:17px;border-radius:16px}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px 2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin-bottom:8px;font-size:14px;font-weight:500}
.alert .ic{margin-top:1px}
.alert.red{background:var(--bad-soft);color:var(--bad)}.alert.amber{background:var(--warn-soft);color:var(--warn)}.alert.soft{background:var(--surface2);color:var(--ink)}.alert.ok{background:var(--good-soft);color:var(--good)}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;padding:0;color:#fff}
.item.done .check{background:var(--good);border-color:var(--good)}
.t{font-weight:600;overflow-wrap:anywhere}
.kind{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.kind.buy{background:var(--accent-soft);color:var(--accent)}.kind.do{background:var(--p2-soft);color:var(--p2)}
.x{border:0;background:none;color:var(--muted);padding:6px;border-radius:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tabbar);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;max-width:120px;border:0;background:none;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button .bub{width:52px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.tabs button.on{color:var(--ink)}
.tabs button.on .bub{background:var(--accent-soft);color:var(--accent)}
.badge{position:absolute;top:2px;left:calc(50% + 10px);background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:10px;font-weight:800;min-width:17px;height:17px;padding:0 5px;display:grid;place-items:center}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.overlay{position:fixed;inset:0;background:rgba(10,8,6,.45);display:flex;align-items:flex-end;z-index:10;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
input[type=time],input[type=date]{min-height:46px;-webkit-appearance:none;appearance:none}
.center{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.face{flex:none;display:inline-block;vertical-align:middle}
.logo{border-radius:24%;display:block;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:17px;letter-spacing:-.01em}
.stat span{font-size:11.5px;color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.big-num{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sumline{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sumline .pill{font-size:12.5px;padding:5px 10px;background:var(--surface2);color:var(--ink)}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:17px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-dow.we{color:var(--accent)}
.cal-day{aspect-ratio:1/1.05;border:0;border-radius:12px;background:none;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px;font-weight:600}
.cal-day.we{background:var(--surface2)}
.cal-day.out{opacity:.3}
.cal-day.today .n{background:var(--ink);color:var(--bg)}
.cal-day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal-day .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.ev{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev .tm{font-size:13px;font-weight:700;color:var(--muted);width:44px;flex:none}
.wk{display:flex;gap:8px;align-items:stretch}
.wk-date{width:58px;flex:none;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.1}
.wk-date small{font-size:10.5px;font-weight:700;color:var(--muted)}
.wk-day{flex:1;min-width:0;border-radius:12px;border:1px solid var(--line);padding:8px 10px;background:var(--surface);text-align:left}
.wk-day .lbl{font-size:11px;font-weight:700;color:var(--muted)}
.free{color:var(--good);font-weight:700;font-size:13px}
.busy{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.hist:first-child{border-top:0}
.hist .d{width:52px;flex:none;font-weight:700;font-size:13px;line-height:1.2}
.hist .d small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.rec{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;background:var(--surface)}
.rec b{display:flex;align-items:center;gap:8px}
.src{font-size:12px;color:var(--muted);line-height:1.5}
.src a{color:var(--muted)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.guide{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:13px;margin-top:8px}
.guide ul{margin:6px 0 0;padding-left:18px}
.guide li{margin:3px 0}
</style>
</head>

// ---------- dates (always Asia/Jakarta) ----------
const TZ = 'Asia/Jakarta';
const ymd = (d = new Date()) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const nowHM = () => new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
const parts = s => s.split('-').map(Number);
const mk = (y, m, d) => new Date(Date.UTC(y, m - 1, d)).toISOString().slice(0, 10);
const addDays = (s, n) => { const [y, m, d] = parts(s); return mk(y, m, d + n); };
const dow = s => { const [y, m, d] = parts(s); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmtShort = s => { const [, m, d] = parts(s); return `${d} ${MON[m - 1]}`; };
const fmtDay = s => `${DOW[dow(s)]}, ${fmtShort(s)}`;
const fmtLong = s => { const [, m, d] = parts(s); return `${DOWL[dow(s)]}, ${d} ${MONL[m - 1]}`; };
const thisSat = t => { const d = dow(t); return d === 6 ? t : d === 0 ? addDays(t, -1) : addDays(t, 6 - d); };
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtMin = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const bedMin = t => { const m = toMin(t); return m == null ? null : m < 12 * 60 ? m + 1440 : m; }; // after-midnight bedtimes sort later
const sleepFrom = (bed, wake) => { const b = toMin(bed), w = toMin(wake); if (b == null || w == null) return null; let d = w - b; if (d <= 0) d += 1440; return d > 16 * 60 ? null : Math.round(d / 6) / 10; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), k = Math.floor(s.length / 2); return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; };
const hrs = h => { if (h == null) return '–'; let H = Math.floor(h), M = Math.round((h - H) * 60); if (M === 60) { H++; M = 0; } return M ? `${H}h ${M}m` : `${H}h`; };
const num = n => n == null ? '–' : Number(n).toLocaleString('en-US');
const t5 = t => t ? t.slice(0, 5) : '';

const FEEL = { good: ['smile', 'Great'], meh: ['meh', 'Okay'], sick: ['thermo', 'Sick'] };
const FOOD = {

function recommend(age) {
  if (age == null) return null;
  const sleep = age < 18 ? { range: '8–10 hours', target: 9 } : age < 65 ? { range: '7–9 hours', target: 7.5 } : { range: '7–8 hours', target: 7 };
  const act = age < 18
    ? { range: '60 min a day, mostly moderate-to-vigorous', target: 420, extra: 'Vigorous activity and muscle-strengthening at least 3 days a week.' }
    : { range: '150–300 min a week moderate, or 75–150 min vigorous', target: 150, extra: age >= 65 ? 'Plus muscle-strengthening 2+ days and balance training 3+ days a week.' : 'Plus muscle-strengthening on 2+ days a week.' };
  const steps = age < 60 ? { range: '7,000–10,000 a day', target: 8000 } : { range: '6,000–8,000 a day', target: 7000 };
  return { sleep, act, steps };
}
const SOURCES = [
  ['WHO (2020) Guidelines on physical activity and sedentary behaviour', 'https://www.who.int/publications/i/item/9789240015128'],

  ['Paluch et al. (2022) Daily steps and mortality, Lancet Public Health', 'https://hospitalhealthcare.com/specialisms/cardiovascular/mortality-benefit-from-higher-daily-steps-plateaus/'],

// ---------- health logic ----------
const byDay = (rows, id) => Object.fromEntries(rows.filter(c => c.member_id === id).map(c => [c.day, c]));
const activeMin = (workouts, id, from, to) => workouts.filter(w => w.member_id === id && w.day >= from && w.day <= to).reduce((s, w) => s + w.minutes * (w.intensity === 'vigorous' ? 2 : 1), 0);

function computeAlerts(members, checkins, workouts, today) {
  const out = [];
  for (const m of members) {
    const by = byDay(checkins, m.id);
    const target = Number(m.sleep_target);
    if (by[today]?.feeling === 'sick') out.push({ level: 'red', icon: 'thermo', text: `${m.name} isn't feeling well today. Go easy and get extra rest.` });

    const sl = [0, 1, 2].map(i => by[addDays(today, -i)]?.sleep_hours).filter(v => v != null).map(Number);
    if (sl.length === 3 && avg(sl) < target) out.push({ level: 'amber', icon: 'bed', text: `${m.name} has averaged ${hrs(avg(sl))} of sleep over the last 3 nights (goal ${hrs(target)}). Aim for an earlier night.` });

    const late = [0, 1, 2].map(i => bedMin(by[addDays(today, -i)]?.bed_time)).filter(v => v != null);
    if (late.length === 3 && late.every(b => b >= 1440 + 30)) out.push({ level: 'amber', icon: 'moon', text: `${m.name} has gone to bed after 00:30 three nights in a row.` });

    const base = []; for (let i = 3; i < 17; i++) { const w = toMin(by[addDays(today, -i)]?.wake_time); if (w != null) base.push(w); }
    const recent = [0, 1, 2].map(i => toMin(by[addDays(today, -i)]?.wake_time)).filter(v => v != null);
    if (base.length >= 5 && recent.length === 3) {
      const usual = median(base);
      if (recent.every(w => Math.abs(w - usual) > 60)) out.push({ level: 'amber', icon: 'sunrise', text: `${m.name}'s wake-up time has shifted: usually ${fmtMin(usual)}, lately around ${fmtMin(avg(recent))}. The rhythm is drifting.` });
    }

    const st = [1, 2, 3].map(i => by[addDays(today, -i)]?.steps).filter(v => v != null);
    if (st.length === 3 && avg(st) < Number(m.steps_target) * 0.5) out.push({ level: 'soft', icon: 'steps', text: `${m.name} has been moving little: ${num(Math.round(avg(st)))} steps a day over the last 3 days.` });

    const usesWorkouts = workouts.some(w => w.member_id === m.id);
    const wk = activeMin(workouts, m.id, addDays(today, -6), today);
    const at = Number(m.activity_target || 150);
    if (usesWorkouts && wk < at * 0.5) out.push({ level: 'soft', icon: 'activity', text: `${m.name}: ${wk} of ${at} active minutes in the last 7 days.` });

    const fd = [0, 1, 2].map(i => by[addDays(today, -i)]?.food_prev).filter(Boolean);
    if (fd.length === 3 && fd.every(f => f === 'bad')) out.push({ level: 'soft', icon: 'food', text: `${m.name} has rated food as poor 3 days in a row.` });

    const everChecked = checkins.some(c => c.member_id === m.id && c.feeling);
    if (everChecked && !by[addDays(today, -1)]?.feeling && !by[addDays(today, -2)]?.feeling && !by[today]?.feeling) out.push({ level: 'soft', icon: 'info', text: `${m.name} hasn't checked in for 2 days. Routine still on track?` });
  }
  return out;
}

function scores(m, checkins, workouts, today) {
  const by = byDay(checkins, m.id);
  const last = (from, to) => { const r = []; for (let i = from; i <= to; i++) r.push(by[addDays(today, -i)]); return r; };
  const sl = last(0, 6).map(c => c?.sleep_hours).filter(v => v != null).map(Number);
  const st = last(1, 7).map(c => c?.steps).filter(v => v != null);
  const wk = last(0, 6).map(c => toMin(c?.wake_time)).filter(v => v != null);
  const bd = last(0, 6).map(c => bedMin(c?.bed_time)).filter(v => v != null);
  const fd = last(0, 6).map(c => c?.food_prev).filter(Boolean).map(f => ({ good: 1, meh: 0.5, bad: 0 })[f]);
  const act = activeMin(workouts, m.id, addDays(today, -6), today);
  const usesWorkouts = workouts.some(w => w.member_id === m.id);
  const sport = [st.length ? Math.min(1, avg(st) / Number(m.steps_target)) : null, usesWorkouts ? Math.min(1, act / Number(m.activity_target || 150)) : null].filter(v => v != null);
  return {
    sleep: sl.length ? Math.min(1, avg(sl) / Number(m.sleep_target)) : null,
    sport: sport.length ? avg(sport) : null,
    food: fd.length ? avg(fd) : null,
    avgSleep: avg(sl), avgSteps: st.length ? Math.round(avg(st)) : null, wake: median(wk), bed: median(bd), act,
  };
}

function sickInsight(m, checkins) {
  const by = byDay(checkins, m.id);
  const sick = Object.values(by).filter(c => c.feeling === 'sick').map(c => c.day);
  const starts = sick.filter(d => !sick.includes(addDays(d, -1)));
  const before = [];
  for (const s of starts) for (let i = 1; i <= 3; i++) { const v = by[addDays(s, -i)]?.sleep_hours; if (v != null) before.push(Number(v)); }
  const normal = Object.values(by).filter(c => c.feeling && c.feeling !== 'sick' && c.sleep_hours != null).map(c => Number(c.sleep_hours));
  if (before.length < 2 || normal.length < 5) return null;
  return `${m.name} got sick ${starts.length}× in 90 days. In the 3 nights before, sleep averaged ${hrs(avg(before))}, versus ${hrs(avg(normal))} on healthy days.`;
}

function CheckIn({ ctx }) {
  const { me, partner, checkins, today } = ctx;
  const row = checkins.find(c => c.member_id === me.id && c.day === today) || {};
  const [local, setLocal] = useState(row);
  const [edit, setEdit] = useState(false);
  useEffect(() => setLocal(row), [JSON.stringify(row)]);

  const save = async patch => {
    const next = { ...local, ...patch };
    const sh = sleepFrom(next.bed_time, next.wake_time);
    if (sh != null) patch.sleep_hours = sh;
    setLocal({ ...next, ...patch });
    const { error } = await sb.from('checkins').upsert({ member_id: me.id, day: today, ...patch, updated_at: new Date().toISOString() }, { onConflict: 'member_id,day' });
    if (error) alert('Could not save: ' + error.message); else ctx.reload();
  };

  const complete = local.wake_time && local.bed_time && local.feeling && local.food_prev;
  const prow = partner && checkins.find(c => c.member_id === partner.id && c.day === today);
  const partnerLine = partner && html`<div className="row small muted" style=${{ marginTop: 14, gap: 8 }}>
    <${Face} color=${ctx.colorOf(partner.id)} size=${20} />
    <span>${partner.name}: ${prow?.feeling ? `checked in · ${FEEL[prow.feeling][1].toLowerCase()}${prow.sleep_hours != null ? ` · slept ${hrs(Number(prow.sleep_hours))}` : ''}` : 'not checked in yet'}</span></div>`;

  if (complete && !edit) return html`<div className="card">
    <div className="card-title"><b>Check-in · ${fmtDay(today)}</b><span className="pill good"><${Icon} n="check" s=${13} w=${2.6} />Done</span></div>
    <div className="sumline">
      <span className="pill"><${Icon} n="bed" s=${14} />${t5(local.bed_time)} → ${t5(local.wake_time)}</span>
      <span className="pill"><${Icon} n="clock" s=${14} />${hrs(Number(local.sleep_hours))}</span>
      <span className="pill"><${Icon} n=${FEEL[local.feeling][0]} s=${14} />${FEEL[local.feeling][1]}</span>
      <span className="pill"><${Icon} n="food" s=${14} />Food ${FOOD[local.food_prev][1].toLowerCase()}</span>
    </div>
    <button className="link" style=${{ marginTop: 10 }} onClick=${() => setEdit(true)}>Edit check-in</button>
    ${partnerLine}</div>`;

  const sh = sleepFrom(local.bed_time, local.wake_time);
  return html`<div className="card">
    <div className="card-title"><b>Check-in · ${fmtDay(today)}</b>${complete && html`<button className="btn sm ghost" onClick=${() => setEdit(false)}>Done</button>`}</div>
    ${!local.wake_time
      ? html`<p className="small muted" style=${{ margin: '0 0 12px' }}>Tap as soon as you wake up. The time is saved automatically.</p>
             <button className="btn big" onClick=${() => save({ wake_time: nowHM() })}><${Icon} n="sunrise" s=${22} />I'm up</button>`
      : html`<div className="q"><${Icon} n="sunrise" s=${17} />Woke up at</div>
             <input type="time" value=${t5(local.wake_time)} onChange=${e => e.target.value && save({ wake_time: e.target.value })} />`}
    <div className="q"><${Icon} n="bed" s=${17} />Went to sleep last night at</div>
    <${Chips} options=${BEDS.map(b => [b, b])} value=${t5(local.bed_time)} onPick=${v => save({ bed_time: v })} />
    <div className="row" style=${{ marginTop: 8 }}>
      <span className="small muted" style=${{ flex: 'none' }}>Other time</span>
      <input type="time" value=${t5(local.bed_time)} onChange=${e => e.target.value && save({ bed_time: e.target.value })} />
    </div>
    ${sh != null && html`<div className="small" style=${{ marginTop: 8, fontWeight: 600 }}>≈ ${hrs(sh)} of sleep</div>`}
    <div className="q"><${Icon} n="smile" s=${17} />How do you feel today?</div>
    <${Chips} options=${Object.entries(FEEL).map(([k, [ic, l]]) => [k, l, ic])} value=${local.feeling} onPick=${v => save({ feeling: v })} />
    <div className="q"><${Icon} n="food" s=${17} />How did you eat yesterday?</div>
    <${FoodPicker} value=${local.food_prev} onPick=${v => save({ food_prev: v })} />
    ${partnerLine}</div>`;
}

function AddWorkout({ ctx, close }) {
  const [day, setDay] = useState(ctx.today);
  const [kind, setKind] = useState('Walk'); const [other, setOther] = useState('');
  const [min, setMin] = useState(30); const [custom, setCustom] = useState('');
  const [inten, setInten] = useState('moderate'); const [busy, setBusy] = useState(false);

  const submit = async () => {
    const k = kind === 'Other' ? other.trim() || 'Other' : kind;
    if (!minutes || minutes <= 0) return;
    setBusy(true);
    const { error } = await sb.from('workouts').insert({ member_id: ctx.me.id, day, kind: k, minutes, intensity: inten });
    setBusy(false); if (error) return alert(error.message); ctx.reload(); close();
  };
  return html`<${Sheet} close=${close}>
    <h3>Log a workout</h3>
    <p className="small muted" style=${{ marginTop: 0 }}>On top of your steps.</p>
    <${Seg} options=${[[ctx.today, 'Today'], [addDays(ctx.today, -1), 'Yesterday']]} value=${day} onPick=${setDay} />

    <div className="q">How long?</div>
    <${Chips} options=${[15, 30, 45, 60, 90].map(m => [m, `${m} min`])} value=${custom ? null : min} onPick=${v => { setMin(v); setCustom(''); }} />

function ReqItem({ r, ctx }) {

function Requests({ ctx }) {
  const [filter, setFilter] = useState('all'); const [adding, setAdding] = useState(false); const [showDone, setShowDone] = useState(false);
  const all = ctx.requests;
  const open = all.filter(r => !r.done_at);
  const shown = open.filter(r => filter === 'all' || (filter === 'mine' ? (r.assignee === ctx.uid || r.assignee == null) : r.created_by === ctx.uid));
  const done = all.filter(r => r.done_at).sort((a, b) => b.done_at.localeCompare(a.done_at)).slice(0, 20);
  const openTitles = new Set(open.map(r => r.title.trim().toLowerCase()));
  const seen = new Set(), again = [];
  for (const r of all.filter(r => r.kind === 'buy' && r.done_at).sort((a, b) => b.done_at.localeCompare(a.done_at))) {
    const k = r.title.trim().toLowerCase(); if (seen.has(k) || openTitles.has(k)) continue;
    seen.add(k); again.push(r); if (again.length >= 12) break;
  }
  const rebuy = async r => {
    const { error } = await sb.from('requests').insert({ kind: 'buy', title: r.title, note: r.note, assignee: r.assignee, created_by: ctx.uid });
    if (error) alert(error.message); ctx.reload();
  };
  return html`<div>
    <${Header} ctx=${ctx} title="Requests" sub="Things to buy and do" />
    <${Seg} options=${[['all', 'All'], ['mine', 'For me'], ['from', 'From me']]} value=${filter} onPick=${setFilter} />
    ${shown.length ? shown.map(r => html`<${ReqItem} key=${r.id} r=${r} ctx=${ctx} />`) : html`<div className="card muted" style=${{ textAlign: 'center' }}>Nothing open. Nice!</div>`}
    <button className="btn" style=${{ marginTop: 4 }} onClick=${() => setAdding(true)}><${Icon} n="plus" s=${18} w=${2.4} />New request</button>
    ${again.length > 0 && html`<${Sec} title="Buy again" />

    ${adding && html`<${AddRequest} ctx=${ctx} close=${() => setAdding(false)} />`}
  </div>`;
}

// ---------- health ----------
function Triangle({ series }) {
  const C = 120, CY = 116, R = 80, ANG = { sleep: -90, sport: 30, food: 150 }, keys = ['sleep', 'sport', 'food'];
  const pt = (k, v) => { const a = ANG[k] * Math.PI / 180; return [C + R * v * Math.cos(a), CY + R * v * Math.sin(a)]; };
  const poly = vals => keys.map(k => pt(k, vals[k] ?? 0).map(n => n.toFixed(1)).join(',')).join(' ');
  const labels = { sleep: 'Sleep', sport: 'Move', food: 'Food' };
  return html`<svg viewBox="0 0 240 205" style=${{ width: '100%', maxWidth: 300, display: 'block', margin: '0 auto' }}>
    ${[0.33, 0.66, 1].map(g => html`<polygon key=${g} points=${poly({ sleep: g, sport: g, food: g })} fill="none" style=${{ stroke: 'var(--line)' }} strokeWidth="1.2" />`)}
    ${keys.map(k => { const [x, y] = pt(k, 1); return html`<line key=${k} x1=${C} y1=${CY} x2=${x} y2=${y} style=${{ stroke: 'var(--line)' }} />`; })}
    ${series.map(s => html`<polygon key=${s.name} points=${poly(s.s)} style=${{ fill: s.soft, stroke: s.color }} strokeWidth="2.2" strokeLinejoin="round" />`)}
    ${keys.map(k => { const [x, y] = pt(k, k === 'sleep' ? 1.2 : 1.2); return html`<text key=${k} x=${x} y=${k === 'sleep' ? y : y + 8} textAnchor="middle" fontSize="11.5" fontWeight="700" style=${{ fill: 'var(--muted)' }}>${labels[k]}</text>`; })}
  </svg>`;
}

          </div>
          ${c.feeling && html`<span title=${FEEL[c.feeling][1]} style=${{ color: c.feeling === 'sick' ? 'var(--bad)' : c.feeling === 'good' ? 'var(--good)' : 'var(--warn)' }}><${Icon} n=${FEEL[c.feeling][0]} s=${19} /></span>`}
          ${c.food_prev && html`<span title=${'Food ' + FOOD[c.food_prev][1]} style=${{ color: c.food_prev === 'bad' ? 'var(--bad)' : c.food_prev === 'good' ? 'var(--good)' : 'var(--warn)' }}><${Icon} n="food" s=${17} /></span>`}
        </button>`; })}
    </div>
    ${sel.id === me.id && html`<p className="tiny muted" style=${{ textAlign: 'center' }}>Tap a day to fill in or fix it.</p>`}
    ${edit && html`<${EditDay} ctx=${ctx} member=${me} day=${edit} close=${() => setEdit(null)} />`}
  </div>`;
}

// ---------- settings ----------
function Settings({ ctx, close }) {
  const { me } = ctx;
  const [name, setName] = useState(me.name);
  const [by, setBy] = useState(me.birth_year ? String(me.birth_year) : '');
  const [sleep, setSleep] = useState(String(me.sleep_target));
  const [act, setAct] = useState(String(me.activity_target ?? 150));
  const [steps, setSteps] = useState(String(me.steps_target));
  const [copied, setCopied] = useState(false);
  const age = by && by.length === 4 ? new Date().getFullYear() - parseInt(by) : null;
  const rec = recommend(age != null && age > 0 && age < 110 ? age : null);
  const apply = () => { setSleep(String(rec.sleep.target)); setAct(String(rec.act.target)); setSteps(String(rec.steps.target)); };
  const save = async () => {
    const { error } = await sb.from('members').update({
      name: name.trim() || me.name, birth_year: by ? parseInt(by) : null,
      sleep_target: Number(sleep) || 7.5, activity_target: parseInt(act) || 150, steps_target: parseInt(steps) || 8000,
    }).eq('id', me.id);
    if (error) return alert(error.message); ctx.reload(); close();
  };
  const copy = async () => { try { await navigator.clipboard.writeText(me.ingest_token); setCopied(true); } catch { prompt('Copy this token:', me.ingest_token); } };
  return html`<${Sheet} close=${close}>
    <div className="row" style=${{ gap: 10 }}><${Face} color=${ctx.colorOf(me.id)} size=${30} /><h3>Settings</h3></div>

    <div className="q">Name</div><input value=${name} onChange=${e => setName(e.target.value)} />
    <div className="q">Birth year</div><input type="number" inputMode="numeric" placeholder="e.g. 1992" value=${by} onChange=${e => setBy(e.target.value)} />

    <div className="q" style=${{ marginTop: 24 }}><${Icon} n="sparkle" s=${17} />Recommended for you${age ? ` (age ${age})` : ''}</div>
    ${rec ? html`
      <div className="rec"><b><${Icon} n="bed" s=${17} />Sleep ${rec.sleep.range}</b>
        <div className="src" style=${{ marginTop: 4 }}>A regular wake-up time matters as much as hours slept.</div></div>
      <div className="rec"><b><${Icon} n="activity" s=${17} />${rec.act.range}</b>
        <div className="src" style=${{ marginTop: 4 }}>${rec.act.extra} Vigorous minutes count double.</div></div>
      <div className="rec"><b><${Icon} n="steps" s=${17} />Steps ${rec.steps.range}</b>
        <div className="src" style=${{ marginTop: 4 }}>Benefits rise up to about this range, then level off. ~7,000 already brings most of the gain.</div></div>
      <button className="btn ghost" onClick=${apply}>Use recommended goals</button>`
    : html`<div className="rec small muted">Add your birth year to see goals based on WHO guidelines and sleep research.</div>`}

    <div className="q" style=${{ marginTop: 24 }}>Your goals</div>
    <div className="row">
      <div className="grow"><div className="tiny muted" style=${{ marginBottom: 4 }}>Sleep (hours)</div><input type="number" step="0.5" inputMode="decimal" value=${sleep} onChange=${e => setSleep(e.target.value)} /></div>
      <div className="grow"><div className="tiny muted" style=${{ marginBottom: 4 }}>Active min/week</div><input type="number" inputMode="numeric" value=${act} onChange=${e => setAct(e.target.value)} /></div>
    </div>
    <div className="tiny muted" style=${{ margin: '10px 0 4px' }}>Steps per day</div>
    <input type="number" inputMode="numeric" value=${steps} onChange=${e => setSteps(e.target.value)} />
    <div style=${{ height: 16 }}></div>
    <button className="btn" onClick=${save}>Save</button>

    <div className="q" style=${{ marginTop: 28 }}>Appearance</div>
    <${Seg} options=${[['system', 'Auto', 'monitor'], ['light', 'Light', 'sun'], ['dark', 'Dark', 'moon']]} value=${ctx.theme} onPick=${ctx.setTheme} />

    <div className="q">iPhone Shortcut token</div>
    <p className="tiny muted" style=${{ marginTop: -4 }}>Used by the Shortcut to send your steps. Don't share it.</p>
    <button className="btn ghost" onClick=${copy}><${Icon} n=${copied ? 'check' : 'copy'} s=${17} />${copied ? 'Copied' : 'Copy token'}</button>
    <div style=${{ height: 10 }}></div>
    <button className="btn ghost" onClick=${() => { ctx.switchMe(); close(); }}><${Icon} n="swap" s=${17} />Switch person (not ${me.name})</button>
    <div style=${{ height: 10 }}></div>
    <button className="btn ghost" onClick=${() => sb.auth.signOut()}><${Icon} n="logout" s=${17} />Sign out</button>

    <details style=${{ marginTop: 22 }}>
      <summary className="link">Sources</summary>
      <div className="src" style=${{ marginTop: 6 }}>${SOURCES.map(([t, u]) => html`<div key=${u} style=${{ marginBottom: 6 }}><a href=${u} target="_blank" rel="noopener">${t}</a></div>`)}
        <div>Kemenkes RI: Permenkes 30/2013 (sugar, salt, fat limits) and Isi Piringku.</div></div>
    </details>
  <//>`;
}

// ---------- home ----------
function Home({ ctx, go }) {
  const { me, members, checkins, workouts, today, requests } = ctx;
  const h = Number(nowHM().slice(0, 2));
  const greet = h < 11 ? 'Good morning' : h < 15 ? 'Good afternoon' : h < 18 ? 'Good evening' : 'Good night';
  const alerts = computeAlerts(members, checkins, workouts, today);
  const forMe = requests.filter(r => !r.done_at && (r.assignee === me.id || r.assignee == null));
  const sat = thisSat(today);
  return html`<div>
    <${Header} ctx=${ctx} logo=${true} title=${`${greet}, ${me.name}`} sub=${fmtLong(today)} />
    <${CheckIn} ctx=${ctx} />
    <${Sec} title="Heads-up" />
    ${alerts.length ? alerts.map((a, i) => html`<div key=${i} className=${'alert ' + a.level}><${Icon} n=${a.icon} s=${18} /><span>${a.text}</span></div>`)
      : html`<div className="alert ok"><${Icon} n="leaf" s=${18} /><span>All good. No warning signs right now.</span></div>`}
    <div style=${{ height: 6 }}></div>
    <${Activity} ctx=${ctx} />
    <${Sec} title=${`For you (${forMe.length})`}>${forMe.length > 4 && html`<button className="link" onClick=${() => go('req')}>See all</button>`}<//>
    ${forMe.length ? forMe.slice(0, 4).map(r => html`<${ReqItem} key=${r.id} r=${r} ctx=${ctx} />`) : html`<div className="card small muted">Nothing for you right now.</div>`}
    <${Sec} title="This weekend"><button className="link" onClick=${() => go('cal')}>Calendar</button><//>
    <div className="wk">
      <div className="wk-date"><small>${MON[parts(sat)[1] - 1]}</small>${parts(sat)[2]}–${parts(addDays(sat, 1))[2]}</div>
      ${[sat, addDays(sat, 1)].map(d => { const p = sortPlans(ctx.plans.filter(x => x.day === d)); return html`<button key=${d} className="wk-day" onClick=${() => go('cal')}>
        <div className="lbl">${DOW[dow(d)]}</div>
        ${p.length ? html`<div className="busy">${p.map(x => x.title).join(', ')}</div>` : html`<div className="free">Free</div>`}</button>`; })}
    </div>
  </div>`;
}

// ---------- shell ----------
function Main({ email, theme, setTheme }) {
  const [tab, setTab] = useState('home');
  const [uid, setUid] = useState(getLS(ME_KEY));
  const [settings, setSettings] = useState(false);
  const [data, setData] = useState(null); const [err, setErr] = useState('');
  const load = useCallback(async () => {
    const t = ymd();
    const [mem, ci, wo, rq, pl] = await Promise.all([
      sb.from('members').select('*').order('created_at').order('id'),
      sb.from('checkins').select('*').gte('day', addDays(t, -90)),
      sb.from('workouts').select('*').gte('day', addDays(t, -90)),
      sb.from('requests').select('*').order('created_at', { ascending: false }).limit(300),
      sb.from('plans').select('*').gte('day', addDays(t, -62)).order('day'),
    ]);
    const e = mem.error || ci.error || wo.error || rq.error || pl.error;
    if (e) { setErr(e.message); return; }
    setErr(''); setData({ members: mem.data, checkins: ci.data, workouts: wo.data, requests: rq.data, plans: pl.data, today: t });
  }, []);
  useEffect(() => {
    load();
    const f = () => document.visibilityState === 'visible' && load();
    document.addEventListener('visibilitychange', f);
    return () => document.removeEventListener('visibilitychange', f);
  }, [load]);

  if (err) return html`<div className="center"><div className="card">Couldn't load: ${err}<div style=${{ height: 12 }}></div><button className="btn" onClick=${load}>Try again</button></div></div>`;
  if (!data) return html`<div className="center muted">Loading…</div>`;
  if (!data.members.length) return html`<div className="center"><div className="card" style=${{ maxWidth: 380 }}><b>${email}</b> doesn't have access to Famly.
    <div style=${{ height: 12 }}></div><button className="btn ghost" onClick=${() => sb.auth.signOut()}>Sign out</button></div></div>`;
  const me = data.members.find(m => m.id === uid);
  if (!me) return html`<${PickMe} members=${data.members} onPick=${id => { setLS(ME_KEY, id); setUid(id); }} />`;
  const partner = data.members.find(m => m.id !== uid);
  const ctx = { ...data, me, partner, uid, reload: load, theme, setTheme, openSettings: () => setSettings(true),
    switchMe: () => { setLS(ME_KEY, null); setUid(null); },
    memberName: id => data.members.find(m => m.id === id)?.name || '?',
    colorOf: id => COLORS[Math.max(0, data.members.findIndex(m => m.id === id)) % 2] };
  const mineOpen = data.requests.filter(r => !r.done_at && (r.assignee === uid || r.assignee == null)).length;
  const TABS = [['home', 'home', 'Home'], ['req', 'list', 'Requests'], ['cal', 'cal', 'Calendar'], ['health', 'heart', 'Health']];
  return html`<div className="app"><main className="pad">
      ${tab === 'home' ? html`<${Home} ctx=${ctx} go=${setTab} />` : tab === 'req' ? html`<${Requests} ctx=${ctx} />` : tab === 'cal' ? html`<${Calendar} ctx=${ctx} />` : html`<${Health} ctx=${ctx} />`}
    </main>
    <nav className="tabs">${TABS.map(([k, ic, l]) => html`<button key=${k} className=${tab === k ? 'on' : ''} onClick=${() => { setTab(k); window.scrollTo(0, 0); }}>
      <span className="bub"><${Icon} n=${ic} s=${22} w=${tab === k ? 2.2 : 1.8} /></span>${l}${k === 'req' && mineOpen > 0 ? html`<span className="badge">${mineOpen}</span>` : null}</button>`)}</nav>
    ${settings && html`<${Settings} ctx=${ctx} close=${() => setSettings(false)} />`}
  </div>`;
}

function useTheme() {
  const [theme, setThemeState] = useState(getLS('famly-theme') || 'system');
  useEffect(() => {
    const root = document.documentElement;
    if (theme === 'system') delete root.dataset.theme; else root.dataset.theme = theme;
    setLS('famly-theme', theme === 'system' ? null : theme);
    const paint = () => { const bg = getComputedStyle(root).getPropertyValue('--bg').trim(); document.querySelector('meta[name=theme-color]').setAttribute('content', bg); };
    paint();
    const mq = matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener('change', paint);
    return () => mq.removeEventListener('change', paint);
  }, [theme]);
  return [theme, setThemeState];
}

function App() {
  const [session, setSession] = useState(undefined);
  const [theme, setTheme] = useTheme();
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);
  if (session === undefined) return html`<div className="center muted">Loading…</div>`;
  return session ? html`<${Main} email=${session.user.email} theme=${theme} setTheme=${setTheme} />` : html`<${Login} />`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
